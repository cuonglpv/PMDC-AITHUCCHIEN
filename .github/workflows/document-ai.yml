name: document-ai

on:
  pull_request:
    paths: ["apps/document-ai/**", "docs/api/document-ai.yaml", ".github/workflows/document-ai.yml"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/document-ai
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
