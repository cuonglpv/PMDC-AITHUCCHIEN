name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start the whole stack
        run: docker compose -f infra/compose.yaml --profile full up -d --build
      - name: Wait for it
        run: |
          curl --fail --silent --show-error --retry 60 --retry-connrefused --retry-all-errors --retry-delay 3 http://localhost:8088/sign-in -o /dev/null
          docker compose -f infra/compose.yaml --profile full exec -T document-ai python -c "import urllib.request as u; u.urlopen('http://localhost:8001/health')"
      - run: npm run e2e
        env:
          CI: "true"
      - name: Logs when it fails
        if: failure()
        run: docker compose -f infra/compose.yaml --profile full logs --tail 100
