[project]
name = "document-ai"
version = "0.1.0"
description = "ClaimLens Document AI Service: stateless AI tasks that return suggestions, never decisions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.123",
    "fastapi[standard]==0.162.0",
    "pillow==13.0.0",
    "pydantic==2.14.2",
    "pydantic-settings>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "schemathesis==4.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/document_ai/contracts/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# FastAPI's Depends in a default argument is how the framework works. The formatter handles line length.
ignore = ["B008", "E501"]
