                code: BALANCE_CHANGED
                requestId: 01JB7Q6T2M8X
                details:
                  newRevisionNo: 3
                  previousPayable: 800000
                  newPayable: 500000
                  payableChanged: true
                  allowedActions: [REJECT, RETURN]
        '422':
