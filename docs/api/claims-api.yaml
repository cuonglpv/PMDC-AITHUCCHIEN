openapi: 3.1.0
info:
  title: ClaimLens Claims API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  summary: Contract between the Staff Web App and the Claims API (TARGET MVP).
  description: |
    AI reads, the Rule Engine calculates, people decide. Conventions, the token flow, error codes and the
    role matrix are explained in [07-api-contract.md](../07-api-contract.md). Business rules (BR-xx) are in
    [03-use-cases.md](../03-use-cases.md) and user stories (USxx) in [08-invest-requirements.md](../08-invest-requirements.md).

    Each operation carries an `x-claimlens` object:

    - `roles`: who may call it and the claim scope for that role (`any`, `registered`, `assigned`, `all`).
      The API enforces this; a role that is not listed gets 403.
    - `states`: claim statuses in which it is allowed. Any other status gets 409 `CLAIM_STATE_CONFLICT`.
    - `release`: `must` is in the first release, `should` follows in the next increment.
    - `stories`, `rules`: where the behaviour is specified.
    - `audit`: `write` records the change, `read` records the access (BR-12), `none` writes nothing.
servers:
  - url: /api/v1
    description: Served from the same origin as the Staff Web App, behind a reverse proxy. The refresh token cookie is SameSite=Strict, so the two must share a site.
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sign-in, token refresh and the signed-in user (UC01).
  - name: Intake
    description: Member search, claim registration, upload and submission (UC02).
  - name: Claims
    description: Queues, claim lookup, status polling and self-assignment (US23).
  - name: Evidence
    description: Documents, pages and extracted fields (UC03).
  - name: Validation
    description: Deterministic alerts (UC04).
  - name: Adjudication
    description: Expense lines, benefit mappings, overrides and calculation revisions (UC05).
  - name: Risk
    description: AI clinical signals, dismissed or kept by the reviewer (UC06).
  - name: Decision
    description: Recommendation, attestation and the approver decision (UC07, UC08).
  - name: Timeline
    description: Claim history (UC11).
  - name: Policy
    description: Benefit plans, versioned rule sets and test runs (UC09).
  - name: AI quality
    description: AI quality dashboard (UC10).
paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in
      description: >-
        Returns a 15-minute access token in the body and sets the refresh token cookie.
        Wrong credentials and a disabled account give the same 401, so no account state is disclosed.
      security: []
      x-claimlens: {roles: {}, release: must, stories: [US01], rules: [BR-11, BR-12], audit: write}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9.example.signature
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 7d0c2f54-3a41-4b7e-9c55-0d1f6a2e8b11
                  email: tran.thu.ha@claimlens.test
                  fullName: Trần Thu Hà
                  initials: TH
                  role: CLAIMS_REVIEWER
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Code: INVALID_CREDENTIALS. Same answer for a wrong password, an unknown email and a disabled account.'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Get a new access token
      description: >-
        Reads the refresh token cookie, rotates it and returns a new access token. A rotated token stays valid for
        10 seconds so two tabs can refresh together; reuse after that revokes the whole sign-in family.
        Rotation never extends the 8-hour limit set at sign-in. A disabled account gets 401 here.
      security:
        - refreshCookie: []
      x-claimlens: {roles: {}, release: must, stories: [US01], rules: [BR-12], audit: none}
      responses:
        '200':
          description: New access token and rotated cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Code: REFRESH_TOKEN_INVALID. The app returns to Sign in.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Code: ORIGIN_NOT_ALLOWED. The Origin header is not the Staff Web App.'
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Sign out
      description: Revokes the sign-in family and clears the cookie. Safe to repeat.
      security:
        - refreshCookie: []
      x-claimlens: {roles: {}, release: must, stories: [US01], rules: [BR-12], audit: write}
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Code: ORIGIN_NOT_ALLOWED. The Origin header is not the Staff Web App.'
  /me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Get the signed-in user
      x-claimlens: {roles: {INTAKE_OFFICER: any, CLAIMS_REVIEWER: any, SENIOR_APPROVER: any, ADMINISTRATOR: any}, release: must, stories: [US01], rules: [BR-11], audit: none}
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/search:
    post:
      operationId: searchMembers
      tags: [Intake]
      summary: Search members
      description: >-
        Searches by member name, national ID or policy number and returns one row per member and policy.
        This is a POST so that a citizen ID never reaches a URL or an access log. No match is an empty list.
      x-claimlens: {roles: {INTAKE_OFFICER: any}, release: must, stories: [US02], rules: [BR-11, BR-12], audit: read}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSearchRequest'
      responses:
        '200':
          description: Matches, at most 20.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /policies/{policyId}/summary:
    get:
      operationId: getPolicySummary
      tags: [Intake]
      summary: Get a policy with its remaining balance
      description: >-
        The annual limit comes from the rule-set version effective on `serviceDate`, or today when it is left out.
        `annualLimit` and `remainingBalance` are null when no version is effective on that date.
      x-claimlens: {roles: {INTAKE_OFFICER: any}, release: must, stories: [US02], rules: [BR-04, BR-10], audit: read}
      parameters:
        - $ref: '#/components/parameters/PolicyId'
        - name: serviceDate
          in: query
          description: Date that selects the rule-set version.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The policy summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
          description: 'Code: VALIDATION_FAILED. `serviceDate` is not a date in YYYY-MM-DD form.'
  /claims:
    get:
      operationId: listClaims
      tags: [Claims]
      summary: List a queue
      description: >-
        `view` selects the queue tab and must belong to the caller's role. Review and approval views sort by BR-09;
        `MY_DRAFTS`, `MY_SUBMISSIONS` and `DECIDED_BY_ME` sort newest first. In `AVAILABLE` the member name is null
        and only a claim number can be filtered on (BR-11). `counts` gives the badge of every tab of the role.
      x-claimlens: {roles: {INTAKE_OFFICER: registered, CLAIMS_REVIEWER: assigned, SENIOR_APPROVER: all}, release: must, stories: [US01, US18, US23], rules: [BR-09, BR-11], audit: read}
      parameters:
        - name: view
          in: query
          required: true
          description: Queue tab.
          schema:
            $ref: '#/components/schemas/QueueView'
        - name: priority
          in: query
          description: Only claims with this priority label.
          schema:
            $ref: '#/components/schemas/Priority'
        - name: planCode
          in: query
          description: Only claims on this benefit plan.
          schema:
            type: string
            maxLength: 20
        - name: serviceDateFrom
          in: query
          description: Earliest service date, inclusive.
          schema:
            type: string
            format: date
        - name: serviceDateTo
          in: query
          description: Latest service date, inclusive.
          schema:
            type: string
            format: date
        - name: claimNumber
          in: query
          description: Part of a claim number. Member names are not searchable here, to keep them out of URLs.
          schema:
            type: string
            maxLength: 20
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of the queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimQueuePage'
              example:
                items:
                  - id: 3f6a1c7e-52d8-4e0b-a1c9-7b2e94d0c184
                    claimNumber: CLM-2026-000199
                    status: READY_FOR_REVIEW
                    isReturned: false
                    memberName: null
                    planCode: SILVER-OP
                    serviceDate: '2026-10-16'
                    claimedTotal: 350000
                    priority: NORMAL
                    statusChangedAt: '2026-10-17T02:15:00Z'
                    assigneeInitials: null
                    fieldsToVerify: 0
                    blockingAlerts: 0
                    warningAlerts: 0
                    openFlags: 0
                    payableAmount: null
                    recommendedOutcome: null
                    decisionAction: null
                    decidedAt: null
                page: 1
                pageSize: 25
                total: 1
                counts:
                  AVAILABLE: 1
                  ASSIGNED_TO_ME: 12
                  NEEDS_VERIFICATION: 5
                  RETURNED: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Code: FORBIDDEN_ROLE. The view does not belong to this role, or the caller is an Administrator.'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      operationId: createClaim
      tags: [Intake]
      summary: Register a claim
      description: >-
        Creates the claim in `DRAFT` with a unique claim number. A service date outside the coverage period or a policy
        that is not active does not stop registration; it comes back in `warnings`.
      x-claimlens: {roles: {INTAKE_OFFICER: any}, release: must, stories: [US02], rules: [BR-01, BR-12], audit: write}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
      responses:
        '201':
          description: Claim created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimSaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
          description: 'Codes: VALIDATION_FAILED, POLICY_MEMBER_MISMATCH.'
  /claim-numbers/{claimNumber}:
    get:
      operationId: getClaimByNumber
      tags: [Claims]
      summary: Go to a claim by its number
      description: Top-bar lookup. A claim outside the caller's scope answers 404, so a number reveals nothing about other claims.
      x-claimlens: {roles: {INTAKE_OFFICER: registered, CLAIMS_REVIEWER: assigned, SENIOR_APPROVER: all}, release: must, stories: [US23], rules: [BR-11, BR-12], audit: read}
      parameters:
        - name: claimNumber
          in: path
          required: true
          description: Claim number, for example CLM-2026-000184.
          schema:
            type: string
            pattern: '^CLM-\d{4}-\d{6}$'
      responses:
        '200':
          description: The claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Code: FORBIDDEN_ROLE. The caller is an Administrator.'
        '404':
          $ref: '#/components/responses/NotFound'
  /claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: getClaim
      tags: [Claims]
      summary: Get a claim
      description: >-
        Everything the case header and Overview need, with `allowedActions` and `blockers` for this caller, so the
        primary action comes from the server. An Intake Officer gets the same shape with `currentRevision`, `balance`
        and `counts` set to null.
      x-claimlens: {roles: {INTAKE_OFFICER: registered, CLAIMS_REVIEWER: assigned, SENIOR_APPROVER: all}, release: must, stories: [US17, US18, US23], rules: [BR-11, BR-12], audit: read}
      responses:
        '200':
          description: The claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetail'
              example:
                id: 3f6a1c7e-52d8-4e0b-a1c9-7b2e94d0c184
                claimNumber: CLM-2026-000184
                status: IN_REVIEW
                isReturned: false
                returnComment: null
                member:
                  id: 91b7d3a2-6c0e-4f18-8a4d-2e5c7f01a9d3
                  memberCode: MB-0007731
                  fullName: Nguyễn Văn An
                  dateOfBirth: '1988-03-14'
                  nationalIdMasked: '********4821'
                policy:
                  id: c4e82b19-07fa-4d36-b5a1-6f3d9e7c2041
                  policyNumber: PL-2026-00731
                  status: ACTIVE
                  coverageStart: '2026-01-01'
                  coverageEnd: '2026-12-31'
                  planCode: GOLD-OP
                  planName: Gold Outpatient
                providerName: Phòng khám Đa khoa Hồng Ngọc
                serviceDate: '2026-10-12'
                claimedTotal: 1400000
                channel: COUNTER
                priority: NORMAL
                registeredBy:
                  id: 2a9f6e10-c3d7-48b2-91e5-a7d04c6b3f28
                  fullName: Phạm Gia Bảo
                  initials: PB
                assignee:
                  id: 7d0c2f54-3a41-4b7e-9c55-0d1f6a2e8b11
                  fullName: Trần Thu Hà
                  initials: TH
                assignedAt: '2026-10-14T01:20:00Z'
                submittedAt: '2026-10-13T09:05:00Z'
                statusChangedAt: '2026-10-14T01:40:00Z'
                createdAt: '2026-10-13T08:50:00Z'
                updatedAt: '2026-10-14T03:12:00Z'
                rowVersion: 14
                ruleSetVersion:
                  id: 5be1d0c7-93a4-4c62-8f17-1e6a2d9b7c30
                  versionNo: 3
                  effectiveFrom: '2026-01-01'
                currentRevision:
                  revisionNo: 2
                  payableAmount: 800000
                  isStale: false
                  createdAt: '2026-10-14T03:12:00Z'
                balance:
                  annualLimit: 5000000
                  consumedAmount: 4200000
                  remainingBalance: 800000
                  projectedAfter: 0
                counts:
                  fieldsToVerify: 0
                  blockingAlerts: 0
                  warningAlerts: 1
                  mappingsToConfirm: 0
                  openFlags: 1
                  keptFlags: 0
                ai:
                  fallbackActive: false
                  clinicalCheck: DONE
                allowedActions: [EDIT_FIELDS, RUN_ADJUDICATION, OVERRIDE_LINE, REVIEW_FLAGS, SUBMIT_RECOMMENDATION]
                blockers: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateClaim
      tags: [Intake]
      summary: Edit a draft claim
      description: Used when the officer goes back in the New claim stepper. The same warnings as `createClaim` can come back.
      x-claimlens: {roles: {INTAKE_OFFICER: registered}, states: [DRAFT], release: must, stories: [US02], rules: [BR-12], audit: write}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClaimRequest'
      responses:
        '200':
          description: Claim saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimSaved'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Codes: CLAIM_STATE_CONFLICT, VERSION_CONFLICT.'
        '422':
          $ref: '#/components/responses/Unprocessable'
          description: 'Codes: VALIDATION_FAILED, POLICY_MEMBER_MISMATCH.'
  /claims/{claimId}/status:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: getClaimStatus
      tags: [Claims]
      summary: Poll claim status
      description: >-
        The one endpoint the web app polls, every 3 seconds while something is running: upload conversion, page check,
        extraction, re-read, mapping, clinical check or summary draft. It carries no medical or identity data and no file
        names, so it is not audited (BR-12). Answers with `Cache-Control: no-store`.
      x-claimlens: {roles: {INTAKE_OFFICER: registered, CLAIMS_REVIEWER: assigned, SENIOR_APPROVER: all}, release: must, stories: [US04, US05, US13], rules: [BR-12], audit: none}
      responses:
        '200':
          description: Current processing state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimStatusSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /claims/{claimId}/facts:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    patch:
      operationId: updateClaimFacts
      tags: [Evidence]
      summary: Correct what intake typed
      description: >-
        Lets the assigned reviewer correct the claimed total, service date or provider name from intake. The change is
        audited and re-runs validation and adjudication. The service date selects the rule-set version (BR-04), and the
        claimed total feeds BR-13 and the `CLAIMED_TOTAL_MISMATCH` check.
      x-claimlens: {roles: {CLAIMS_REVIEWER: assigned}, states: [NEEDS_VERIFICATION, IN_REVIEW], release: must, stories: [US07, US13], rules: [BR-04, BR-12, BR-13], audit: write}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClaimFactsRequest'
      responses:
        '200':
          description: Corrected and re-checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Codes: CLAIM_STATE_CONFLICT, VERSION_CONFLICT.'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /claims/{claimId}/submit:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      operationId: submitClaim
      tags: [Intake]
      summary: Submit a claim for processing
      description: Moves the claim to `PROCESSING` and queues `FIELD_EXTRACTION`. A page check still running does not block submission.
      x-claimlens: {roles: {INTAKE_OFFICER: registered}, states: [DRAFT], release: must, stories: [US03, US05], rules: [BR-12], audit: write}
      responses:
        '202':
          description: Submitted; poll `getClaimStatus`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimStatusSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Codes: CLAIM_STATE_CONFLICT, UPLOAD_IN_PROGRESS, NO_READY_DOCUMENT.'
  /claims/{claimId}/start-review:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      operationId: startReview
      tags: [Claims]
      summary: Take a claim (self-assign)
      description: >-
        Assigns an unassigned claim to the caller. A `READY_FOR_REVIEW` claim moves to `IN_REVIEW`, a `NEEDS_VERIFICATION`
        claim stays there. Repeating the call as the same reviewer succeeds. "Open next claim" is `listClaims` with
        `pageSize=1` followed by this operation; on 409 the app takes the next one.
      x-claimlens: {roles: {CLAIMS_REVIEWER: any}, states: [NEEDS_VERIFICATION, READY_FOR_REVIEW, IN_REVIEW], release: must, stories: [US23], rules: [BR-11, BR-12], audit: write}
      responses:
        '200':
          description: The claim, now visible in full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Codes: CLAIM_ALREADY_ASSIGNED, CLAIM_STATE_CONFLICT.'
  /claims/{claimId}/documents:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: listDocuments
      tags: [Evidence]
      summary: List documents and their pages
      x-claimlens: {roles: {INTAKE_OFFICER: registered, CLAIMS_REVIEWER: assigned, SENIOR_APPROVER: all}, release: must, stories: [US03, US04, US06], rules: [BR-11, BR-12], audit: read}
      responses:
        '200':
          description: Documents, without removed ones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: uploadDocument
      tags: [Intake]
      summary: Upload one file
      description: >-
        One file per request. Type and size are checked at once (415, 413). The answer has status `CONVERTING`; conversion,
        page split and the 30-page limit finish in the background, and `getClaimStatus` then shows `READY` or `REJECTED`
        with a reason. `READY` queues a `PAGE_CHECK` run.
      x-claimlens: {roles: {INTAKE_OFFICER: registered}, states: [DRAFT], release: must, stories: [US03, US04], rules: [BR-12], audit: write}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
            encoding:
              file:
                contentType: image/jpeg, image/png, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '201':
          description: File stored; processing continues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Code: CLAIM_STATE_CONFLICT.'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
          description: >-
