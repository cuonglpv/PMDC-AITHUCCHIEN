      tags: [Decision]
      summary: Approve, partially approve or reject
      description: >-
        The client never sends an amount. `APPROVE` and `PARTIALLY_APPROVE` must match the payable of `revisionNo` (BR-13) and consume the balance.
        `REJECT` is always open: it needs a reason code, also a comment when the payable is above 0, and its final amount is 0. An approval locks
        the policy row and compares `balance_version`. If it changed, the answer is 409 `BALANCE_CHANGED` and a `BALANCE_RECHECK` revision now exists:
