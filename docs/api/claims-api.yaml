      summary: List synthetic sample claims
      description: Seeded synthetic claims for test runs; there is no operation to create them.
      x-claimlens: {roles: {ADMINISTRATOR: any}, release: should, stories: [US20], rules: [BR-11], audit: none}
      parameters:
        - name: planId
          in: query
          description: Only samples of this plan.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sample claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleClaimList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ai-quality/metrics:
    get:
      operationId: getAiQualityMetrics
      tags: [AI quality]
      summary: Get AI quality metrics
      description: >-
        KPI tiles and breakdowns for a date range and model version, with the change from the previous period of the same length. `aiRunCount` of 0 means
        no AI ran, which the empty state tells apart from "no results".
      x-claimlens: {roles: {SENIOR_APPROVER: any}, release: should, stories: [US21], rules: [BR-11], audit: none}
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ModelVersion'
      responses:
        '200':
          description: The metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiQualityMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /ai-quality/drill-down:
    get:
      operationId: getAiQualityDrillDown
      tags: [AI quality]
      summary: List the claims behind a metric
      x-claimlens: {roles: {SENIOR_APPROVER: all}, release: should, stories: [US21], rules: [BR-11, BR-12], audit: read}
      parameters:
        - name: metric
          in: query
          required: true
          description: The metric to open.
          schema:
            $ref: '#/components/schemas/AiQualityMetric'
        - name: dimension
          in: query
          description: A breakdown key, for example a field key, document type, category or flag type.
          schema:
            type: string
            maxLength: 40
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ModelVersion'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimQueuePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /ai-quality/export:
    get:
      operationId: exportReport
      tags: [AI quality]
      summary: Export the dashboard as XLSX
      description: The filtered figures and the claim numbers behind them. No member or medical data leaves the system in this file.
      x-claimlens: {roles: {SENIOR_APPROVER: any}, release: should, stories: [US21], rules: [BR-11, BR-12], audit: read}
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ModelVersion'
      responses:
        '200':
          description: The workbook.
          headers:
            Content-Disposition:
              description: File name for the download.
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `login` or `refreshToken`. Lives 15 minutes and is kept in memory by the web app.
    refreshCookie:
      type: apiKey
      in: cookie
      name: claimlens_refresh
      description: Refresh token. HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth. JavaScript cannot read it.
  headers:
    RefreshTokenCookie:
      description: Sets, rotates or clears the refresh token cookie.
      schema:
        type: string
      example: claimlens_refresh=opaque-value; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=28800
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      description: Claim id.
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      description: Policy id.
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Document id.
      schema:
        type: string
        format: uuid
    PageId:
      name: pageId
      in: path
      required: true
      description: Document page id.
      schema:
        type: string
        format: uuid
    FieldId:
      name: fieldId
      in: path
      required: true
      description: Claim field id.
      schema:
        type: string
        format: uuid
    AlertId:
      name: alertId
      in: path
      required: true
      description: Alert id.
      schema:
        type: string
        format: uuid
    LineId:
      name: lineId
      in: path
      required: true
      description: Expense line id.
      schema:
        type: string
        format: uuid
    FlagId:
      name: flagId
      in: path
      required: true
      description: Risk flag id.
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      description: Benefit plan id.
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      description: Rule-set version id.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Page number, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Rows per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    From:
      name: from
      in: query
      required: true
      description: First day of the range.
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: true
      description: Last day of the range.
      schema:
        type: string
        format: date
    ModelVersion:
      name: modelVersion
      in: query
      description: Only runs of this model version. All versions when left out.
      schema:
        type: string
        maxLength: 40
  responses:
    Unauthorized:
      description: 'Code: AUTH_REQUIRED. The access token is missing, expired or invalid; the app calls `refreshToken` and retries once.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'Codes: FORBIDDEN_ROLE, CLAIM_OUT_OF_SCOPE.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 'Code: NOT_FOUND.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'The current state does not allow this. See `code`; `VERSION_CONFLICT` carries the current values in `details`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Another user changed this claim
            status: 409
            code: VERSION_CONFLICT
            requestId: 01JB7Q6T2M8X
            details:
              currentRowVersion: 15
              current:
                claimedTotal: 1400000
    Unprocessable:
      description: 'Code: VALIDATION_FAILED, with one entry per field in `errors`, or a more specific rule code.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Check the highlighted fields
            status: 422
            code: VALIDATION_FAILED
            requestId: 01JB7Q6T2M8X
            errors:
              - field: note
                code: REQUIRED
                message: A note is required.
    TooManyRequests:
      description: 'Code: TOO_MANY_ATTEMPTS. Too many sign-in attempts from this address or for this email.'
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: 'Code: FILE_TOO_LARGE. The limit is 20 MB per file.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: 'Code: UNSUPPORTED_FILE_TYPE. Accepted: JPG, PNG, PDF, DOCX and XLSX.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    # ---- Shared values ----
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Whole VND, with no decimals.
    NullableMoney:
      type: [integer, 'null']
      format: int64
      minimum: 0
      description: Whole VND, or null when not known yet.
    Confidence:
      type: number
      minimum: 0
      maximum: 1
      description: AI confidence from 0 to 1, with three decimals.
    Bbox:
      type: object
      description: A region of a page, normalised to the page size (0 to 1), so it survives rendering at another size.
      required: [x, y, w, h]
      properties:
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        w: {type: number, minimum: 0, maximum: 1}
        h: {type: number, minimum: 0, maximum: 1}
    StaffRef:
      type: object
      required: [id, fullName, initials]
      properties:
        id: {type: string, format: uuid}
        fullName: {type: string}
        initials: {type: string, maxLength: 4, description: Replaces the AI marker once this person accepts or edits a value.}
    NullableStaffRef:
      oneOf:
        - $ref: '#/components/schemas/StaffRef'
        - type: 'null'
    RowVersion:
      type: integer
      minimum: 0
      description: Optimistic lock. Send back the value you read; a newer one on the server gives 409 `VERSION_CONFLICT`.
    Warning:
      type: object
      description: Something the user should see that does not stop the action.
      required: [code, message]
      properties:
        code: {$ref: '#/components/schemas/WarningCode'}
        message: {type: string}
    WarningCode:
      type: string
      enum: [COVERAGE_OUTSIDE_PERIOD, POLICY_NOT_ACTIVE, OPEN_FLAGS, OPEN_HIGH_FLAGS, UNCITED_SENTENCES, CLINICAL_CHECK_NOT_RUN]
    # ---- Errors ----
    Problem:
      type: object
      description: RFC 9457 problem details, with a stable `code` that the web app maps to a message.
      required: [title, status, code, requestId]
      properties:
        type: {type: string, format: uri-reference, default: about:blank}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {$ref: '#/components/schemas/ErrorCode'}
        requestId: {type: string, description: Same value as the X-Request-Id response header and audit_event.request_id.}
        errors:
          type: array
          description: Field problems, present with VALIDATION_FAILED.
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          description: Extra data for some codes.
          oneOf:
            - $ref: '#/components/schemas/VersionConflictDetails'
            - $ref: '#/components/schemas/BalanceChangedDetails'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: {type: string, description: Name of the request property.}
        code: {type: string, description: 'For example REQUIRED, TOO_LONG, OUT_OF_RANGE.'}
        message: {type: string}
    VersionConflictDetails:
      type: object
      description: Lets the Conflict UI state keep local input and show what changed.
      required: [currentRowVersion, current]
      properties:
        currentRowVersion: {$ref: '#/components/schemas/RowVersion'}
        current: {type: object, description: The resource as it is now.}
    BalanceChangedDetails:
      type: object
      required: [newRevisionNo, previousPayable, newPayable, payableChanged, allowedActions]
      properties:
        newRevisionNo: {type: integer, description: The BALANCE_RECHECK revision the system just created.}
        previousPayable: {$ref: '#/components/schemas/Money'}
        newPayable: {$ref: '#/components/schemas/Money'}
        payableChanged: {type: boolean}
        allowedActions:
          type: array
          description: What the approver can do now.
          items:
            $ref: '#/components/schemas/DecisionAction'
    ErrorCode:
      type: string
      description: Stable error codes; the meaning of each is in 07-api-contract.md.
      enum:
        - INVALID_CREDENTIALS
        - REFRESH_TOKEN_INVALID
        - AUTH_REQUIRED
        - ORIGIN_NOT_ALLOWED
        - TOO_MANY_ATTEMPTS
        - FORBIDDEN_ROLE
        - CLAIM_OUT_OF_SCOPE
        - MAKER_CHECKER
        - NOT_FOUND
        - VALIDATION_FAILED
        - FILE_TOO_LARGE
        - UNSUPPORTED_FILE_TYPE
        - POLICY_MEMBER_MISMATCH
        - CLAIM_STATE_CONFLICT
        - VERSION_CONFLICT
        - UPLOAD_IN_PROGRESS
        - NO_READY_DOCUMENT
        - FIELDS_TO_VERIFY
        - PAGE_UNCLASSIFIED
        - CLAIM_ALREADY_ASSIGNED
        - SOURCE_REQUIRED
        - FIELD_HAS_NO_AI_VALUE
        - ALERT_NOT_OPEN
        - ALERT_NOT_DISMISSIBLE
        - FLAG_NOT_OPEN
        - BLOCKING_ALERT_OPEN
        - MAPPING_UNCONFIRMED
        - LINE_AMOUNT_MISSING
        - NO_EFFECTIVE_RULE_SET
        - NO_CALCULATION_REVISION
        - NO_ACTIVE_OVERRIDE
        - UNKNOWN_CATEGORY
        - OVERRIDE_EXCEEDS_LINE
        - OVERRIDE_AMOUNT_MISMATCH
        - REVISION_OUTDATED
        - REVISION_STALE
        - ATTESTATION_OUTDATED
        - SUMMARY_REQUIRED
        - OUTCOME_NOT_ALLOWED
        - OUTCOME_REASON_REQUIRED
        - DECISION_NOT_ALLOWED
        - DECISION_REASON_REQUIRED
        - DECISION_COMMENT_REQUIRED
        - BALANCE_CHANGED
        - DRAFT_ALREADY_EXISTS
        - RULE_SET_NOT_DRAFT
        - RULE_INVALID
        - EFFECTIVE_DATE_NOT_LATER
        - CATEGORY_NOT_CONFIGURED
        - INTERNAL_ERROR
    # ---- Enums, same values as claimlens.dbml ----
    StaffRole:
      type: string
      enum: [INTAKE_OFFICER, CLAIMS_REVIEWER, SENIOR_APPROVER, ADMINISTRATOR]
    PolicyStatus:
      type: string
      enum: [ACTIVE, LAPSED, TERMINATED]
    RuleSetStatus:
      type: string
      enum: [DRAFT, PUBLISHED, DISCARDED]
    RuleType:
      type: string
      enum: [ELIGIBILITY, COVERAGE, EXCLUSION, WAITING_PERIOD, COINSURANCE, LIMIT]
    LimitScope:
      type: string
      enum: [PER_VISIT, ANNUAL]
    ClaimStatus:
      type: string
      enum: [DRAFT, PROCESSING, NEEDS_VERIFICATION, READY_FOR_REVIEW, IN_REVIEW, PENDING_APPROVAL, APPROVED, PARTIALLY_APPROVED, REJECTED]
    IntakeChannel:
      type: string
      enum: [COUNTER, POST, EMAIL, PARTNER]
    FileFormat:
      type: string
      enum: [JPG, PNG, PDF, DOCX, XLSX]
    DocumentStatus:
      type: string
      enum: [UPLOADING, CONVERTING, READY, REJECTED, REMOVED]
    PageType:
      type: string
      enum: [INVOICE, RECEIPT, PRESCRIPTION, VISIT_SUMMARY, LAB_RESULT, OTHER, UNCLASSIFIED]
    PageQuality:
      type: string
      enum: [NOT_CHECKED, READABLE, LOW_QUALITY]
    PageAiStatus:
      type: string
      enum: [QUEUED, READING, DONE, FAILED]
    ValueSource:
      type: string
      enum: [AI, USER]
    AiTask:
      type: string
      enum: [PAGE_CHECK, FIELD_EXTRACTION, PAGE_REREAD, BENEFIT_MAPPING, CLINICAL_CHECK, SUMMARY_DRAFT]
    AiRunStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
    ConfidenceLevel:
      type: string
      description: 'HIGH is shown as High, CHECK as Check, MISSING as Missing. MISSING applies to fields only.'
      enum: [HIGH, CHECK, MISSING]
    FieldKey:
      type: string
      enum: [insured_name, national_id, policy_number, provider_name, provider_tax_code, service_date, invoice_number, invoice_total, line_description, line_quantity, line_unit_price, line_amount, diagnosis, medication]
    FieldStatus:
      type: string
      enum: [NEEDS_VERIFICATION, NEEDS_ENTRY, AUTO_ACCEPTED, CONFIRMED, CORRECTED, ENTERED, NOT_PRESENT]
    LineOrigin:
      type: string
      enum: [AI_EXTRACTED, MANUAL]
    MappingStatus:
      type: string
      enum: [PENDING, AUTO_ACCEPTED, NEEDS_CONFIRMATION, CONFIRMED, CHANGED, MANUAL]
    AlertCheck:
      type: string
      enum: [REQUIRED_DOCUMENTS, INSURED_IDENTITY, POLICY_MATCH, DATE_CONSISTENCY, INVOICE_ARITHMETIC, CLAIMED_TOTAL_MISMATCH, DUPLICATE_INVOICE]
    AlertSeverity:
      type: string
      enum: [BLOCKING, WARNING]
    AlertStatus:
      type: string
      enum: [OPEN, RESOLVED, DISMISSED]
    FlagType:
      type: string
      enum: [MEDICATION_DIAGNOSIS, SERVICE_DIAGNOSIS, LAB_DIAGNOSIS, QUANTITY]
    FlagSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    FlagStatus:
      type: string
      enum: [OPEN, DISMISSED, KEPT, SUPERSEDED]
    ReasonCode:
      type: string
      enum:
        - DISMISS_VALUE_VERIFIED
        - DISMISS_CLINICALLY_PLAUSIBLE
        - DISMISS_KNOWN_EXCEPTION
        - KEEP_NEEDS_APPROVER
        - KEEP_EVIDENCE_MISSING
        - OVERRIDE_MEDICAL_NECESSITY
        - OVERRIDE_CONTRACT_EXCEPTION
        - OVERRIDE_DATA_ERROR
        - OUTCOME_EXCLUSION_AND_LIMIT
        - OUTCOME_MEDICAL_NECESSITY
        - OUTCOME_GENERAL_EXCLUSION
        - OUTCOME_ANNUAL_MAXIMUM
        - OUTCOME_OUTSIDE_COVERAGE
        - OUTCOME_EVIDENCE_MISSING
    AlertDismissReason:
      type: string
      enum: [DISMISS_VALUE_VERIFIED, DISMISS_KNOWN_EXCEPTION]
    FlagDismissReason:
      type: string
      enum: [DISMISS_VALUE_VERIFIED, DISMISS_CLINICALLY_PLAUSIBLE, DISMISS_KNOWN_EXCEPTION]
    FlagKeepReason:
      type: string
      enum: [KEEP_NEEDS_APPROVER, KEEP_EVIDENCE_MISSING]
    OverrideReason:
      type: string
      enum: [OVERRIDE_MEDICAL_NECESSITY, OVERRIDE_CONTRACT_EXCEPTION, OVERRIDE_DATA_ERROR]
    OutcomeReason:
      type: string
      enum: [OUTCOME_EXCLUSION_AND_LIMIT, OUTCOME_MEDICAL_NECESSITY, OUTCOME_GENERAL_EXCLUSION, OUTCOME_ANNUAL_MAXIMUM, OUTCOME_OUTSIDE_COVERAGE, OUTCOME_EVIDENCE_MISSING]
    LineResult:
      type: string
      enum: [COVERED, PARTIALLY_COVERED, EXCLUDED]
    RevisionTrigger:
      type: string
      enum: [INITIAL, DATA_CHANGE, MAPPING_CHANGE, OVERRIDE, BALANCE_RECHECK]
    ClaimOutcome:
      type: string
      enum: [APPROVED, PARTIALLY_APPROVED, REJECTED]
    RecommendationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, RETURNED, DECIDED]
    DecisionAction:
      type: string
      enum: [APPROVE, PARTIALLY_APPROVE, REJECT, RETURN]
    ActorType:
      type: string
      enum: [USER, SYSTEM, AI]
    # ---- Enums that exist only in the API ----
    Priority:
      type: string
      description: Label for display and filtering (BR-09). HIGH means high value or an unresolved High flag. The queue order itself follows the full BR-09 keys.
      enum: [HIGH, NORMAL]
    QueueView:
      type: string
      description: >-
        AVAILABLE, ASSIGNED_TO_ME, NEEDS_VERIFICATION and RETURNED belong to the Claims Reviewer. PENDING_APPROVAL and DECIDED_BY_ME belong to the
        Senior Approver. MY_DRAFTS and MY_SUBMISSIONS belong to the Intake Officer.
      enum: [AVAILABLE, ASSIGNED_TO_ME, NEEDS_VERIFICATION, RETURNED, PENDING_APPROVAL, DECIDED_BY_ME, MY_DRAFTS, MY_SUBMISSIONS]
    AllowedAction:
      type: string
      description: What this caller can do now. The web app renders actions from this list and never decides them itself.
      enum: [EDIT_CLAIM, UPLOAD_DOCUMENT, SUBMIT_CLAIM, START_REVIEW, EDIT_FIELDS, DISMISS_ALERT, RUN_ADJUDICATION, OVERRIDE_LINE, REVIEW_FLAGS, SUBMIT_RECOMMENDATION, APPROVE, PARTIALLY_APPROVE, REJECT, RETURN]
    ClinicalCheckState:
      type: string
      description: NOT_RUN and FAILED are both shown as "Clinical check not run".
      enum: [NOT_RUN, RUNNING, DONE, FAILED]
    FieldValueKind:
      type: string
      description: Which value property applies. TEXT and NUMBER use valueText, MONEY uses valueAmount, DATE uses valueDate.
      enum: [TEXT, NUMBER, MONEY, DATE]
    AiQualityMetric:
      type: string
      enum: [LOW_CONFIDENCE, FIELD_CORRECTION, MAPPING_CORRECTION, MAPPING_AUTO_ACCEPTED, FLAG_DISMISSAL, CLINICAL_FALSE_POSITIVE]
    # ---- Auth ----
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, maxLength: 200}
    StaffUser:
      type: object
      required: [id, email, fullName, initials, role]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        fullName: {type: string}
        initials: {type: string, maxLength: 4}
        role: {$ref: '#/components/schemas/StaffRole'}
    AuthSession:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, description: Seconds until the access token expires.}
        user: {$ref: '#/components/schemas/StaffUser'}
    # ---- Members and policies ----
    MemberSearchRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 2, maxLength: 120, description: 'Member name, national ID or policy number.'}
    MemberSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MemberSearchResult'
    MemberSearchResult:
      type: object
      description: One member with one policy. A member with two policy years gives two rows.
      required: [memberId, memberCode, fullName, dateOfBirth, nationalIdMasked, policy]
      properties:
        memberId: {type: string, format: uuid}
        memberCode: {type: string}
        fullName: {type: string}
        dateOfBirth: {type: string, format: date}
        nationalIdMasked: {type: string, description: Only the last four digits are readable.}
        policy: {$ref: '#/components/schemas/PolicySummary'}
    PolicySummary:
      type: object
      required: [policyId, policyNumber, memberId, planCode, planName, status, coverageStart, coverageEnd, firstEnrolledOn, consumedAmount, annualLimit, remainingBalance, asOfDate]
      properties:
        policyId: {type: string, format: uuid}
        policyNumber: {type: string}
        memberId: {type: string, format: uuid}
        planCode: {type: string}
        planName: {type: string}
        status: {$ref: '#/components/schemas/PolicyStatus'}
        coverageStart: {type: string, format: date}
        coverageEnd: {type: string, format: date}
        firstEnrolledOn: {type: string, format: date}
        consumedAmount: {$ref: '#/components/schemas/Money'}
        annualLimit: {$ref: '#/components/schemas/NullableMoney'}
        remainingBalance: {$ref: '#/components/schemas/NullableMoney'}
        asOfDate: {type: string, format: date, description: Date that selected the rule-set version.}
    # ---- Claims ----
    CreateClaimRequest:
      type: object
      required: [memberId, policyId, serviceDate, providerName, claimedTotal, channel]
      properties:
        memberId: {type: string, format: uuid}
        policyId: {type: string, format: uuid}
        serviceDate: {type: string, format: date}
        providerName: {type: string, minLength: 1, maxLength: 200}
        claimedTotal: {type: integer, format: int64, minimum: 1, description: Whole VND.}
        channel: {$ref: '#/components/schemas/IntakeChannel'}
    UpdateClaimRequest:
      type: object
      required: [rowVersion]
      minProperties: 2
      properties:
        rowVersion: {$ref: '#/components/schemas/RowVersion'}
        memberId: {type: string, format: uuid}
        policyId: {type: string, format: uuid}
        serviceDate: {type: string, format: date}
        providerName: {type: string, minLength: 1, maxLength: 200}
        claimedTotal: {type: integer, format: int64, minimum: 1, description: Whole VND.}
        channel: {$ref: '#/components/schemas/IntakeChannel'}
    UpdateClaimFactsRequest:
      type: object
      required: [rowVersion]
      minProperties: 2
      properties:
        rowVersion: {$ref: '#/components/schemas/RowVersion'}
        serviceDate: {type: string, format: date}
        providerName: {type: string, minLength: 1, maxLength: 200}
        claimedTotal: {type: integer, format: int64, minimum: 1, description: Whole VND.}
    ClaimQueueItem:
      type: object
      description: One queue row. In the AVAILABLE view `memberName` is null, because the reviewer has not taken the claim yet (BR-11).
      required: [id, claimNumber, status, isReturned, memberName, planCode, serviceDate, claimedTotal, priority, statusChangedAt, assigneeInitials, fieldsToVerify, blockingAlerts, warningAlerts, openFlags, payableAmount, recommendedOutcome, decisionAction, decidedAt]
      properties:
        id: {type: string, format: uuid}
        claimNumber: {type: string}
        status: {$ref: '#/components/schemas/ClaimStatus'}
        isReturned: {type: boolean, description: IN_REVIEW with a return comment; shown as the Returned pill.}
        memberName: {type: [string, 'null']}
        planCode: {type: string}
        serviceDate: {type: string, format: date}
        claimedTotal: {$ref: '#/components/schemas/Money'}
        priority: {$ref: '#/components/schemas/Priority'}
        statusChangedAt: {type: string, format: date-time, description: The web app shows the queue age from this.}
        assigneeInitials: {type: [string, 'null']}
        fieldsToVerify: {type: integer, minimum: 0}
        blockingAlerts: {type: integer, minimum: 0}
        warningAlerts: {type: integer, minimum: 0}
        openFlags: {type: integer, minimum: 0}
        payableAmount: {$ref: '#/components/schemas/NullableMoney'}
        recommendedOutcome:
          description: Approval queue preview.
          oneOf:
            - $ref: '#/components/schemas/ClaimOutcome'
            - type: 'null'
        decisionAction:
          description: Set in DECIDED_BY_ME.
          oneOf:
            - $ref: '#/components/schemas/DecisionAction'
            - type: 'null'
        decidedAt: {type: [string, 'null'], format: date-time}
    ClaimQueuePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClaimQueueItem'
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
        counts:
          type: object
          description: Badge count of each tab of the caller's role. Left out of a drill-down.
          propertyNames:
            $ref: '#/components/schemas/QueueView'
          additionalProperties:
            type: integer
            minimum: 0
    ClaimMember:
      type: object
      required: [id, memberCode, fullName, dateOfBirth, nationalIdMasked]
      properties:
        id: {type: string, format: uuid}
        memberCode: {type: string}
        fullName: {type: string}
        dateOfBirth: {type: string, format: date}
        nationalIdMasked: {type: string}
    ClaimPolicy:
      type: object
      required: [id, policyNumber, status, coverageStart, coverageEnd, planCode, planName]
      properties:
        id: {type: string, format: uuid}
        policyNumber: {type: string}
        status: {$ref: '#/components/schemas/PolicyStatus'}
        coverageStart: {type: string, format: date}
        coverageEnd: {type: string, format: date}
        planCode: {type: string}
        planName: {type: string}
    RuleSetRef:
      type: object
      required: [id, versionNo, effectiveFrom]
      properties:
        id: {type: string, format: uuid}
        versionNo: {type: integer, description: Shown as v3.}
        effectiveFrom: {type: string, format: date}
    NullableRuleSetRef:
      oneOf:
        - $ref: '#/components/schemas/RuleSetRef'
        - type: 'null'
    CurrentRevision:
      type: object
      required: [revisionNo, payableAmount, isStale, createdAt]
      properties:
        revisionNo: {type: integer, minimum: 1}
        payableAmount: {$ref: '#/components/schemas/Money'}
        isStale: {type: boolean, description: The inputs changed since this revision and it was not recalculated. Blocks submission.}
        createdAt: {type: string, format: date-time}
    ClaimBalance:
      type: object
      required: [annualLimit, consumedAmount, remainingBalance, projectedAfter]
      properties:
        annualLimit: {$ref: '#/components/schemas/NullableMoney'}
        consumedAmount: {$ref: '#/components/schemas/Money'}
        remainingBalance: {$ref: '#/components/schemas/NullableMoney'}
        projectedAfter: {$ref: '#/components/schemas/NullableMoney'}
    ClaimCounts:
      type: object
      required: [fieldsToVerify, blockingAlerts, warningAlerts, mappingsToConfirm, openFlags, keptFlags]
      properties:
        fieldsToVerify: {type: integer, minimum: 0}
        blockingAlerts: {type: integer, minimum: 0}
        warningAlerts: {type: integer, minimum: 0}
        mappingsToConfirm: {type: integer, minimum: 0}
        openFlags: {type: integer, minimum: 0}
        keptFlags: {type: integer, minimum: 0}
    ClaimAiState:
      type: object
      required: [fallbackActive, clinicalCheck]
      properties:
        fallbackActive: {type: boolean, description: An AI run failed; the web app shows the fallback banner and the work continues by hand.}
        clinicalCheck: {$ref: '#/components/schemas/ClinicalCheckState'}
    Blocker:
      type: object
      description: Why an action is not open yet, so the screen can name the missing item.
      required: [code, message]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string}
    ClaimDetail:
      type: object
      required: [id, claimNumber, status, isReturned, returnComment, member, policy, providerName, serviceDate, claimedTotal, channel, priority, registeredBy, assignee, assignedAt, submittedAt, statusChangedAt, createdAt, updatedAt, rowVersion, ruleSetVersion, currentRevision, balance, counts, ai, allowedActions, blockers]
      properties:
        id: {type: string, format: uuid}
        claimNumber: {type: string, description: 'CLM-YYYY-NNNNNN.'}
        status: {$ref: '#/components/schemas/ClaimStatus'}
        isReturned: {type: boolean}
        returnComment: {type: [string, 'null']}
        member: {$ref: '#/components/schemas/ClaimMember'}
        policy: {$ref: '#/components/schemas/ClaimPolicy'}
        providerName: {type: string}
        serviceDate: {type: string, format: date}
        claimedTotal: {$ref: '#/components/schemas/Money'}
        channel: {$ref: '#/components/schemas/IntakeChannel'}
        priority: {$ref: '#/components/schemas/Priority'}
        registeredBy: {$ref: '#/components/schemas/StaffRef'}
        assignee: {$ref: '#/components/schemas/NullableStaffRef'}
        assignedAt: {type: [string, 'null'], format: date-time}
        submittedAt: {type: [string, 'null'], format: date-time}
        statusChangedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        rowVersion: {$ref: '#/components/schemas/RowVersion'}
        ruleSetVersion: {$ref: '#/components/schemas/NullableRuleSetRef'}
        currentRevision:
          oneOf:
            - $ref: '#/components/schemas/CurrentRevision'
            - type: 'null'
        balance:
          oneOf:
            - $ref: '#/components/schemas/ClaimBalance'
            - type: 'null'
        counts:
          oneOf:
            - $ref: '#/components/schemas/ClaimCounts'
            - type: 'null'
        ai: {$ref: '#/components/schemas/ClaimAiState'}
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/AllowedAction'
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
    ClaimSaved:
      type: object
      required: [claim, warnings]
      properties:
        claim: {$ref: '#/components/schemas/ClaimDetail'}
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    ClaimProgress:
      type: object
      description: What a change did to the claim. Validation and adjudication have already re-run when this comes back.
      required: [status, isReturned, rowVersion, fieldsToVerify, blockingAlerts, warningAlerts, mappingsToConfirm, currentRevisionNo, payableAmount, isRevisionStale, revisionCreated]
      properties:
        status: {$ref: '#/components/schemas/ClaimStatus'}
        isReturned: {type: boolean}
        rowVersion: {$ref: '#/components/schemas/RowVersion'}
        fieldsToVerify: {type: integer, minimum: 0}
        blockingAlerts: {type: integer, minimum: 0}
        warningAlerts: {type: integer, minimum: 0}
        mappingsToConfirm: {type: integer, minimum: 0}
        currentRevisionNo: {type: [integer, 'null']}
        payableAmount: {$ref: '#/components/schemas/NullableMoney'}
        isRevisionStale: {type: boolean}
        revisionCreated: {type: boolean, description: This change created a new revision; the web app shows "What changed".}
    AiRunRef:
      type: object
      required: [id, task, status, requestedAt]
      properties:
        id: {type: string, format: uuid}
        task: {$ref: '#/components/schemas/AiTask'}
        status: {$ref: '#/components/schemas/AiRunStatus'}
        requestedAt: {type: string, format: date-time}
    AiRunState:
      type: object
      required: [id, task, status, errorCode, modelName, modelVersion, requestedAt, startedAt, finishedAt]
      properties:
        id: {type: string, format: uuid}
        task: {$ref: '#/components/schemas/AiTask'}
        status: {$ref: '#/components/schemas/AiRunStatus'}
        errorCode: {type: [string, 'null']}
        modelName: {type: string}
        modelVersion: {type: string}
        requestedAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    PageState:
      type: object
      required: [id, claimPageNo, pageType, quality, aiStatus]
      properties:
        id: {type: string, format: uuid}
        claimPageNo: {type: integer, minimum: 1, maximum: 30}
        pageType: {$ref: '#/components/schemas/PageType'}
        quality: {$ref: '#/components/schemas/PageQuality'}
        aiStatus: {$ref: '#/components/schemas/PageAiStatus'}
    DocumentState:
      type: object
      required: [id, status, rejectionReason, pages]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/DocumentStatus'}
        rejectionReason: {type: [string, 'null']}
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PageState'
    ClaimStatusSnapshot:
      type: object
      description: The polling response. No medical data, identity data or file names, so it is not audited.
      required: [claimId, status, isReturned, rowVersion, fallbackActive, clinicalCheck, currentRevisionNo, isRevisionStale, documents, aiRuns]
      properties:
        claimId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ClaimStatus'}
        isReturned: {type: boolean}
        rowVersion: {$ref: '#/components/schemas/RowVersion'}
        fallbackActive: {type: boolean}
        clinicalCheck: {$ref: '#/components/schemas/ClinicalCheckState'}
        currentRevisionNo: {type: [integer, 'null']}
        isRevisionStale: {type: boolean}
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentState'
        aiRuns:
          type: array
          description: The latest run of each task, or of each page for PAGE_CHECK and PAGE_REREAD.
          items:
            $ref: '#/components/schemas/AiRunState'
    # ---- Documents and pages ----
    UploadDocumentRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          contentMediaType: application/octet-stream
          description: 'JPG, PNG, PDF, DOCX or XLSX, up to 20 MB.'
    PageAiSuggestion:
      type: object
      required: [pageType, confidence, level, qualityScore, runId]
      properties:
        pageType: {$ref: '#/components/schemas/PageType'}
        confidence: {$ref: '#/components/schemas/Confidence'}
        level: {$ref: '#/components/schemas/ConfidenceLevel'}
        qualityScore: {$ref: '#/components/schemas/Confidence'}
        runId: {type: string, format: uuid}
    DocumentPage:
      type: object
      required: [id, documentId, pageNo, claimPageNo, widthPx, heightPx, pageType, pageTypeSource, pageTypeSetBy, quality, aiStatus, ai]
      properties:
        id: {type: string, format: uuid}
        documentId: {type: string, format: uuid}
        pageNo: {type: integer, minimum: 1, description: Page inside the file.}
        claimPageNo: {type: integer, minimum: 1, maximum: 30, description: 'Page across the claim, shown as p1 to p30.'}
        widthPx: {type: integer}
        heightPx: {type: integer}
        pageType: {$ref: '#/components/schemas/PageType'}
        pageTypeSource:
          oneOf:
            - $ref: '#/components/schemas/ValueSource'
            - type: 'null'
        pageTypeSetBy: {$ref: '#/components/schemas/NullableStaffRef'}
        quality: {$ref: '#/components/schemas/PageQuality'}
        aiStatus: {$ref: '#/components/schemas/PageAiStatus'}
        ai:
          oneOf:
            - $ref: '#/components/schemas/PageAiSuggestion'
            - type: 'null'
    Document:
      type: object
      required: [id, originalFilename, fileFormat, sizeBytes, pageCount, status, rejectionReason, uploadedBy, uploadedAt, pages]
      properties:
        id: {type: string, format: uuid}
        originalFilename: {type: string}
        fileFormat: {$ref: '#/components/schemas/FileFormat'}
        sizeBytes: {type: integer, format: int64}
        pageCount: {type: [integer, 'null']}
        status: {$ref: '#/components/schemas/DocumentStatus'}
        rejectionReason: {type: [string, 'null']}
        uploadedBy: {$ref: '#/components/schemas/StaffRef'}
        uploadedAt: {type: string, format: date-time}
        pages:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPage'
    DocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
    ReclassifyPageRequest:
      type: object
      required: [pageType]
      properties:
        pageType:
          type: string
          description: Any page type except UNCLASSIFIED.
          enum: [INVOICE, RECEIPT, PRESCRIPTION, VISIT_SUMMARY, LAB_RESULT, OTHER]
    # ---- Fields ----
    FieldAiSuggestion:
      type: object
      required: [value, confidence, level, pageId, bbox, runId]
      properties:
        value: {type: [string, 'null'], description: Null when the level is MISSING; a value below 0.70 is never shown (US05).}
        confidence: {$ref: '#/components/schemas/Confidence'}
        level: {$ref: '#/components/schemas/ConfidenceLevel'}
        pageId: {type: [string, 'null'], format: uuid}
        bbox:
          oneOf:
            - $ref: '#/components/schemas/Bbox'
            - type: 'null'
        runId: {type: string, format: uuid}
    ClaimField:
      type: object
      required: [id, documentId, fieldKey, itemNo, expenseLineId, status, required, valueKind, valueText, valueAmount, valueDate, sourcePageId, sourceBbox, ai, aiMarker, resolvedBy, resolvedAt, rowVersion]
      properties:
        id: {type: string, format: uuid}
        documentId: {type: string, format: uuid}
        fieldKey: {$ref: '#/components/schemas/FieldKey'}
        itemNo: {type: integer, minimum: 0, description: '0 is the document header; n is expense line or prescription item n.'}
        expenseLineId: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/FieldStatus'}
        required: {type: boolean, description: Must be resolved before the claim can leave NEEDS_VERIFICATION.}
        valueKind: {$ref: '#/components/schemas/FieldValueKind'}
        valueText: {type: [string, 'null']}
        valueAmount: {$ref: '#/components/schemas/NullableMoney'}
        valueDate: {type: [string, 'null'], format: date}
        sourcePageId: {type: [string, 'null'], format: uuid}
        sourceBbox:
          oneOf:
            - $ref: '#/components/schemas/Bbox'
            - type: 'null'
        ai:
          oneOf:
            - $ref: '#/components/schemas/FieldAiSuggestion'
            - type: 'null'
        aiMarker: {type: boolean, description: Show the AI marker; false once a person has resolved the field.}
        resolvedBy: {$ref: '#/components/schemas/NullableStaffRef'}
        resolvedAt: {type: [string, 'null'], format: date-time}
        rowVersion: {$ref: '#/components/schemas/RowVersion'}
    FieldList:
      type: object
      required: [items, remainingToVerify]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClaimField'
        remainingToVerify: {type: integer, minimum: 0}
    AcceptFieldRequest:
      type: object
      required: [rowVersion]
      properties:
        rowVersion: {$ref: '#/components/schemas/RowVersion'}
        sourcePageId: {type: string, format: uuid, description: Only when AI gave no source and the reviewer drew one.}
        sourceBbox: {$ref: '#/components/schemas/Bbox'}
    UpdateFieldRequest:
      type: object
      required: [rowVersion, action]
      properties:
        rowVersion: {$ref: '#/components/schemas/RowVersion'}
        action:
          type: string
          enum: [SET_VALUE, NOT_PRESENT]
        valueText: {type: string, description: 'For TEXT and NUMBER fields, with SET_VALUE.'}
        valueAmount: {type: integer, format: int64, minimum: 0, description: 'For MONEY fields, with SET_VALUE.'}
        valueDate: {type: string, format: date, description: 'For DATE fields, with SET_VALUE.'}
        sourcePageId: {type: string, format: uuid}
        sourceBbox: {$ref: '#/components/schemas/Bbox'}
    FieldChangeResult:
      type: object
      required: [field, progress]
      properties:
        field: {$ref: '#/components/schemas/ClaimField'}
        progress: {$ref: '#/components/schemas/ClaimProgress'}
    # ---- Alerts ----
    ClaimRef:
      type: object
      description: A link to another claim. Opening it follows the caller's own scope.
      required: [id, claimNumber]
      properties:
        id: {type: string, format: uuid}
        claimNumber: {type: string}
    Alert:
      type: object
      required: [id, checkCode, severity, message, details, duplicateOfClaim, status, dismissible, raisedAt, lastCheckedAt, resolvedBy, resolvedAt, reasonCode, note]
      properties:
        id: {type: string, format: uuid}
        checkCode: {$ref: '#/components/schemas/AlertCheck'}
        severity: {$ref: '#/components/schemas/AlertSeverity'}
        message: {type: string}
        details: {type: [object, 'null'], description: Conflicting values with their claim_field ids.}
        duplicateOfClaim:
          oneOf:
            - $ref: '#/components/schemas/ClaimRef'
            - type: 'null'
        status: {$ref: '#/components/schemas/AlertStatus'}
        dismissible: {type: boolean, description: False for CLAIMED_TOTAL_MISMATCH.}
        raisedAt: {type: string, format: date-time}
        lastCheckedAt: {type: string, format: date-time}
        resolvedBy: {$ref: '#/components/schemas/NullableStaffRef'}
        resolvedAt: {type: [string, 'null'], format: date-time}
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
        note: {type: [string, 'null']}
    AlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
    DismissAlertRequest:
      type: object
      required: [reasonCode, note]
      properties:
        reasonCode: {$ref: '#/components/schemas/AlertDismissReason'}
        note: {type: string, minLength: 1, maxLength: 2000}
    AlertChangeResult:
      type: object
      required: [alert, progress]
      properties:
        alert: {$ref: '#/components/schemas/Alert'}
        progress: {$ref: '#/components/schemas/ClaimProgress'}
    ValidationResult:
      type: object
      required: [items, progress]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        progress: {$ref: '#/components/schemas/ClaimProgress'}
    # ---- Expense lines ----
    LineMappingAi:
      type: object
      required: [categoryCode, confidence, level, runId]
      properties:
        categoryCode: {type: string}
        confidence: {$ref: '#/components/schemas/Confidence'}
        level: {$ref: '#/components/schemas/ConfidenceLevel'}
        runId: {type: string, format: uuid}
    LineMapping:
      type: object
      required: [status, categoryCode, ai, resolvedBy, resolvedAt]
      properties:
        status: {$ref: '#/components/schemas/MappingStatus'}
        categoryCode: {type: [string, 'null'], description: The benefit category in use.}
        ai:
          oneOf:
            - $ref: '#/components/schemas/LineMappingAi'
            - type: 'null'
        resolvedBy: {$ref: '#/components/schemas/NullableStaffRef'}
        resolvedAt: {type: [string, 'null'], format: date-time}
    LineOverride:
      type: object
      required: [result, amount, reasonCode, note, by, at]
      properties:
        result: {$ref: '#/components/schemas/LineResult'}
        amount: {$ref: '#/components/schemas/Money'}
        reasonCode: {$ref: '#/components/schemas/OverrideReason'}
        note: {type: string}
        by: {$ref: '#/components/schemas/StaffRef'}
        at: {type: string, format: date-time}
    ExpenseLine:
      type: object
      required: [id, documentId, lineNo, description, quantity, unitPrice, amount, origin, mapping, override]
      properties:
        id: {type: string, format: uuid}
        documentId: {type: string, format: uuid, description: The invoice the line was read from.}
        lineNo: {type: integer, minimum: 1}
        description: {type: [string, 'null'], description: As printed on the invoice.}
        quantity: {type: [number, 'null']}
        unitPrice: {$ref: '#/components/schemas/NullableMoney'}
        amount: {$ref: '#/components/schemas/NullableMoney'}
        origin: {$ref: '#/components/schemas/LineOrigin'}
        mapping: {$ref: '#/components/schemas/LineMapping'}
        override:
          oneOf:
            - $ref: '#/components/schemas/LineOverride'
            - type: 'null'
    ExpenseLineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseLine'
    AddExpenseLineRequest:
      type: object
      required: [documentId]
      properties:
        documentId: {type: string, format: uuid, description: The invoice this line belongs to.}
    ConfirmMappingRequest:
      type: object
      required: [categoryCode]
      properties:
        categoryCode: {type: string, maxLength: 40}
    OverrideLineRequest:
      type: object
      required: [result, reasonCode, note]
      properties:
        result: {$ref: '#/components/schemas/LineResult'}
        amount: {type: integer, format: int64, minimum: 0, description: Required for PARTIALLY_COVERED; must be above 0 and below the line amount.}
        reasonCode: {$ref: '#/components/schemas/OverrideReason'}
        note: {type: string, minLength: 1, maxLength: 2000}
    LineChangeResult:
      type: object
      required: [line, progress]
      properties:
        line: {$ref: '#/components/schemas/ExpenseLine'}
        progress: {$ref: '#/components/schemas/ClaimProgress'}
    # ---- Calculation ----
    FormulaRow:
      type: object
      required: [label, ruleCode, delta, total]
      properties:
        label: {type: string}
        ruleCode: {type: [string, 'null']}
        delta: {type: [integer, 'null'], format: int64, description: Change in VND at this step; negative when reduced.}
        total: {$ref: '#/components/schemas/Money'}
    RuleCitation:
      type: object
      required: [ruleCode, clauseText, clauseRef]
      properties:
        ruleCode: {type: string}
        clauseText: {type: string}
        clauseRef: {type: [string, 'null']}
    CalculationLine:
      type: object
      required: [expenseLineId, lineNo, description, categoryCode, claimedAmount, engineResult, engineCoveredAmount, engineRule, isOverridden, finalResult, finalCoveredAmount, changedSincePrevious]
      properties:
        expenseLineId: {type: string, format: uuid}
        lineNo: {type: integer, minimum: 1}
        description: {type: [string, 'null']}
        categoryCode: {type: string}
        claimedAmount: {$ref: '#/components/schemas/Money'}
        engineResult: {$ref: '#/components/schemas/LineResult'}
        engineCoveredAmount: {$ref: '#/components/schemas/Money'}
        engineRule: {$ref: '#/components/schemas/RuleCitation'}
        isOverridden: {type: boolean}
        finalResult: {$ref: '#/components/schemas/LineResult'}
        finalCoveredAmount: {$ref: '#/components/schemas/Money'}
        changedSincePrevious: {type: boolean}
    CalculationRevisionSummary:
      type: object
      required: [revisionNo, triggerType, triggeredBy, ruleSetVersionNo, payableAmount, isStale, createdAt]
      properties:
        revisionNo: {type: integer, minimum: 1}
        triggerType: {$ref: '#/components/schemas/RevisionTrigger'}
        triggeredBy: {$ref: '#/components/schemas/NullableStaffRef'}
        ruleSetVersionNo: {type: integer}
        payableAmount: {$ref: '#/components/schemas/Money'}
        isStale: {type: boolean}
        createdAt: {type: string, format: date-time}
    CalculationRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalculationRevisionSummary'
    CalculationRevision:
      type: object
      description: An immutable snapshot of one calculation. Only the highest revision can be stale.
      required: [id, revisionNo, ruleSetVersion, triggerType, triggeredBy, engineVersion, claimedTotal, eligibleTotal, afterRateAmount, perVisitLimit, annualLimit, consumedBefore, remainingLimit, payableAmount, projectedRemainingAfter, isStale, createdAt, formula, lines]
      properties:
        id: {type: string, format: uuid}
        revisionNo: {type: integer, minimum: 1}
        ruleSetVersion: {$ref: '#/components/schemas/RuleSetRef'}
        triggerType: {$ref: '#/components/schemas/RevisionTrigger'}
        triggeredBy: {$ref: '#/components/schemas/NullableStaffRef'}
        engineVersion: {type: string}
        claimedTotal: {$ref: '#/components/schemas/Money'}
        eligibleTotal: {$ref: '#/components/schemas/Money'}
        afterRateAmount: {$ref: '#/components/schemas/Money'}
        perVisitLimit: {$ref: '#/components/schemas/NullableMoney'}
        annualLimit: {$ref: '#/components/schemas/NullableMoney'}
        consumedBefore: {$ref: '#/components/schemas/Money'}
        remainingLimit: {type: integer, format: int64, description: 'min(per-visit limit, annual limit - consumed). Can be below 0; the payable then is 0.'}
        payableAmount: {$ref: '#/components/schemas/Money'}
        projectedRemainingAfter: {type: integer, format: int64}
        isStale: {type: boolean}
        createdAt: {type: string, format: date-time}
        formula:
          type: array
          items:
            $ref: '#/components/schemas/FormulaRow'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CalculationLine'
    # ---- Risk flags ----
    RiskFlag:
      type: object
      description: A signal, not a finding.
      required: [id, aiRunId, expenseLine, diagnosis, flagType, severity, relevanceScore, aiReason, status, reviewedBy, reviewedAt, reasonCode, note, createdAt]
      properties:
        id: {type: string, format: uuid}
        aiRunId: {type: string, format: uuid}
        expenseLine:
          type: object
          required: [id, lineNo, description]
          properties:
            id: {type: string, format: uuid}
            lineNo: {type: integer, minimum: 1}
            description: {type: [string, 'null']}
        diagnosis:
          type: [object, 'null']
          required: [fieldId, value]
          properties:
            fieldId: {type: string, format: uuid}
            value: {type: [string, 'null']}
        flagType: {$ref: '#/components/schemas/FlagType'}
        severity: {$ref: '#/components/schemas/FlagSeverity'}
        relevanceScore: {$ref: '#/components/schemas/Confidence'}
        aiReason: {type: string, description: One sentence.}
        status: {$ref: '#/components/schemas/FlagStatus'}
        reviewedBy: {$ref: '#/components/schemas/NullableStaffRef'}
        reviewedAt: {type: [string, 'null'], format: date-time}
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
        note: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    FlagList:
      type: object
      required: [items, clinicalCheck]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RiskFlag'
        clinicalCheck: {$ref: '#/components/schemas/ClinicalCheckState'}
    DismissFlagRequest:
      type: object
      required: [reasonCode, note]
      properties:
        reasonCode: {$ref: '#/components/schemas/FlagDismissReason'}
        note: {type: string, minLength: 1, maxLength: 2000}
    KeepFlagRequest:
      type: object
      required: [reasonCode, note]
      properties:
        reasonCode: {$ref: '#/components/schemas/FlagKeepReason'}
        note: {type: string, minLength: 1, maxLength: 2000}
    # ---- Recommendation and decision ----
    Citation:
      type: object
      required: [label, kind, id]
      properties:
        label: {type: string, description: 'Chip text, for example Invoice p2 or EX-04.'}
        kind:
          type: string
          enum: [FIELD, PAGE, RULE, OVERRIDE, FLAG, CALCULATION]
        id: {type: string, description: 'Id of the cited item; for a rule, its rule code.'}
    SummarySentence:
      type: object
      description: A sentence without citations is marked "No source" for the reviewer.
      required: [text, origin, citations]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
        origin: {$ref: '#/components/schemas/ValueSource'}
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
    AttestationItem:
      type: object
      description: One auto-accepted AI value used in the calculation, the `line_amount` of a line or its benefit mapping.
      required: [kind, id, label, value, confidence]
      properties:
        kind:
          type: string
          enum: [FIELD, MAPPING]
        id: {type: string, format: uuid, description: The claim_field id or the expense_line id.}
        label: {type: string}
        value: {type: string}
        confidence: {$ref: '#/components/schemas/Confidence'}
    AttestedItemRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [FIELD, MAPPING]
        id: {type: string, format: uuid}
    Decision:
      type: object
      required: [action, decidedBy, decidedAt, decisionRevisionNo, finalPayable, reasonCode, comment]
      properties:
        action: {$ref: '#/components/schemas/DecisionAction'}
        decidedBy: {$ref: '#/components/schemas/StaffRef'}
        decidedAt: {type: string, format: date-time}
        decisionRevisionNo: {type: integer, minimum: 1}
        finalPayable: {$ref: '#/components/schemas/NullableMoney'}
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/OutcomeReason'
            - type: 'null'
        comment: {type: [string, 'null']}
    Recommendation:
      type: object
      required: [id, status, revisionNo, proposedOutcome, recommendedOutcome, outcomeReason, outcomeNote, recommendedPayable, claimedTotal, summary, summaryAiRunId, summaryEdited, attestedValues, attestedAt, openHighFlags, submittedBy, submittedAt, decision, createdAt]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/RecommendationStatus'}
        revisionNo: {type: integer, minimum: 1, description: The revision the reviewer recommended on.}
        proposedOutcome: {$ref: '#/components/schemas/ClaimOutcome'}
        recommendedOutcome:
          oneOf:
            - $ref: '#/components/schemas/ClaimOutcome'
            - type: 'null'
        outcomeReason:
          oneOf:
            - $ref: '#/components/schemas/OutcomeReason'
            - type: 'null'
        outcomeNote: {type: [string, 'null']}
        recommendedPayable: {$ref: '#/components/schemas/NullableMoney'}
        claimedTotal: {$ref: '#/components/schemas/NullableMoney'}
        summary:
          type: array
          items:
            $ref: '#/components/schemas/SummarySentence'
        summaryAiRunId: {type: [string, 'null'], format: uuid}
        summaryEdited: {type: boolean}
        attestedValues:
          type: array
          items:
            $ref: '#/components/schemas/AttestationItem'
        attestedAt: {type: [string, 'null'], format: date-time}
        openHighFlags: {type: integer, minimum: 0}
        submittedBy: {$ref: '#/components/schemas/NullableStaffRef'}
        submittedAt: {type: [string, 'null'], format: date-time}
        decision:
          oneOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        createdAt: {type: string, format: date-time}
    SubmissionReadiness:
      type: object
      description: The "Before you submit" list. Submit stays disabled while `missing` has items.
      required: [ready, missing, warnings]
      properties:
        ready: {type: boolean}
        missing:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    RecommendationWorkspace:
      type: object
      required: [recommendation, proposedOutcome, readiness, attestationItems, allowedDecisionActions]
      properties:
        recommendation:
          description: The latest row, which holds the return comment or the decision. Null before the first draft.
          oneOf:
            - $ref: '#/components/schemas/Recommendation'
            - type: 'null'
        proposedOutcome:
          description: From the current payable (BR-13). Null before the first revision.
          oneOf:
            - $ref: '#/components/schemas/ClaimOutcome'
            - type: 'null'
        readiness: {$ref: '#/components/schemas/SubmissionReadiness'}
        attestationItems:
          type: array
          items:
            $ref: '#/components/schemas/AttestationItem'
        allowedDecisionActions:
          type: array
          description: Filled for a Senior Approver in PENDING_APPROVAL; empty otherwise. Empty for the person who submitted (BR-06).
          items:
            $ref: '#/components/schemas/DecisionAction'
    SaveRecommendationDraftRequest:
      type: object
      required: [summary]
      properties:
        summary:
          type: array
          items:
            $ref: '#/components/schemas/SummarySentence'
        recommendedOutcome: {$ref: '#/components/schemas/ClaimOutcome'}
        outcomeReason: {$ref: '#/components/schemas/OutcomeReason'}
        outcomeNote: {type: string, maxLength: 2000}
    SubmitRecommendationRequest:
      type: object
      required: [revisionNo, recommendedOutcome, summary, attestedItems]
      properties:
        revisionNo: {type: integer, minimum: 1}
        recommendedOutcome: {$ref: '#/components/schemas/ClaimOutcome'}
        outcomeReason: {$ref: '#/components/schemas/OutcomeReason'}
        outcomeNote: {type: string, maxLength: 2000}
        summary:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SummarySentence'
        attestedItems:
          type: array
          items:
            $ref: '#/components/schemas/AttestedItemRef'
    DecideClaimRequest:
      type: object
      required: [revisionNo, action]
      properties:
        revisionNo: {type: integer, minimum: 1, description: The revision the approver saw.}
        action:
          type: string
          enum: [APPROVE, PARTIALLY_APPROVE, REJECT]
        reasonCode: {$ref: '#/components/schemas/OutcomeReason'}
        comment: {type: string, maxLength: 2000, description: Required for REJECT when the payable is above 0.}
    ReturnClaimRequest:
      type: object
      required: [comment]
      properties:
        comment: {type: string, minLength: 1, maxLength: 2000}
    RecommendationResult:
      type: object
      required: [recommendation, progress]
      properties:
        recommendation: {$ref: '#/components/schemas/Recommendation'}
        progress: {$ref: '#/components/schemas/ClaimProgress'}
    # ---- Timeline ----
    TimelineEvent:
      type: object
      required: [id, occurredAt, actorType, actor, eventType, entityType, entityId, before, after, aiRun]
      properties:
        id: {type: integer, format: int64}
        occurredAt: {type: string, format: date-time}
        actorType: {$ref: '#/components/schemas/ActorType'}
        actor: {$ref: '#/components/schemas/NullableStaffRef'}
        eventType: {type: string, description: 'For example CLAIM_STATUS_CHANGED, FIELD_CORRECTED or DECISION_RECORDED.'}
        entityType: {type: string}
        entityId: {type: string}
        before: {type: [object, 'null']}
        after: {type: [object, 'null']}
        aiRun:
          type: [object, 'null']
          required: [id, modelName, modelVersion]
          properties:
            id: {type: string, format: uuid}
            modelName: {type: string}
            modelVersion: {type: string}
    TimelinePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
    # ---- Policy ----
    Plan:
      type: object
      required: [id, code, name, description, currentVersion, draftVersionId]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        currentVersion: {$ref: '#/components/schemas/NullableRuleSetRef'}
        draftVersionId: {type: [string, 'null'], format: uuid}
    PlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    RuleSetVersionSummary:
      type: object
      required: [id, planId, versionNo, status, effectiveFrom, basedOnVersionId, changeNote, createdBy, createdAt, publishedBy, publishedAt]
      properties:
        id: {type: string, format: uuid}
        planId: {type: string, format: uuid}
        versionNo: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/RuleSetStatus'}
        effectiveFrom: {type: [string, 'null'], format: date}
        basedOnVersionId: {type: [string, 'null'], format: uuid}
        changeNote: {type: [string, 'null']}
        createdBy: {$ref: '#/components/schemas/StaffRef'}
        createdAt: {type: string, format: date-time}
        publishedBy: {$ref: '#/components/schemas/NullableStaffRef'}
        publishedAt: {type: [string, 'null'], format: date-time}
    RuleSetVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleSetVersionSummary'
    BenefitRule:
      type: object
      required: [id, ruleCode, ruleType, categoryCode, clauseText, clauseRef, applyOrder, rateBp, limitAmount, limitScope, waitingDays]
      properties:
        id: {type: string, format: uuid}
        ruleCode: {type: string, description: 'For example COV-01, EX-04, COINS-80, LIM-ANNUAL.'}
        ruleType: {$ref: '#/components/schemas/RuleType'}
        categoryCode: {type: [string, 'null']}
        clauseText: {type: string}
        clauseRef: {type: [string, 'null']}
        applyOrder: {type: integer}
        rateBp: {type: [integer, 'null'], minimum: 0, maximum: 10000, description: 'Share the insurer pays, in basis points. 8000 means 80%.'}
        limitAmount: {$ref: '#/components/schemas/NullableMoney'}
        limitScope:
          oneOf:
            - $ref: '#/components/schemas/LimitScope'
            - type: 'null'
        waitingDays: {type: [integer, 'null'], minimum: 0}
    BenefitRuleInput:
      type: object
      description: Which of `rateBp`, `limitAmount`, `limitScope`, `waitingDays` and `categoryCode` apply depends on `ruleType` (checks ck_rule_*).
      required: [ruleCode, ruleType, clauseText, applyOrder]
      properties:
        ruleCode: {type: string, minLength: 1, maxLength: 20}
        ruleType:
          type: string
          enum: [COVERAGE, EXCLUSION, WAITING_PERIOD, COINSURANCE, LIMIT]
        categoryCode: {type: string, maxLength: 40}
        clauseText: {type: string, minLength: 1}
        clauseRef: {type: string, maxLength: 40}
        applyOrder:
          type: integer
          description: >-
            Rules apply by kind: ELIGIBILITY, WAITING_PERIOD, EXCLUSION, COVERAGE, then COINSURANCE and LIMIT. This orders rules of one kind,
            and must be above every rule of a kind that applies before it, or the save is refused with RULE_INVALID.
        rateBp: {type: integer, minimum: 0, maximum: 10000}
        limitAmount: {type: integer, format: int64, minimum: 1}
        limitScope: {$ref: '#/components/schemas/LimitScope'}
        waitingDays: {type: integer, minimum: 0}
    RuleSetVersionDetail:
      allOf:
        - $ref: '#/components/schemas/RuleSetVersionSummary'
        - type: object
          required: [rules]
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/BenefitRule'
    CreatePlanVersionRequest:
      type: object
      properties:
        basedOnVersionId: {type: string, format: uuid}
        changeNote: {type: string, maxLength: 2000}
    UpdateRuleSetRequest:
      type: object
      required: [rules]
      properties:
        changeNote: {type: string, maxLength: 2000}
        rules:
          type: array
          items:
            $ref: '#/components/schemas/BenefitRuleInput'
    PublishPlanVersionRequest:
      type: object
      required: [effectiveFrom]
      properties:
        effectiveFrom: {type: string, format: date}
    BenefitCategory:
      type: object
      required: [code, name, description]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
    BenefitCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BenefitCategory'
    SampleClaimLine:
      type: object
      required: [lineNo, description, categoryCode, claimedAmount]
      properties:
        lineNo: {type: integer, minimum: 1}
        description: {type: string}
        categoryCode: {type: string}
        claimedAmount: {$ref: '#/components/schemas/Money'}
    SampleClaim:
      type: object
      required: [id, code, name, planId, serviceDate, firstEnrolledOn, consumedBefore, lines]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        planId: {type: string, format: uuid}
        serviceDate: {type: string, format: date}
        firstEnrolledOn: {type: string, format: date}
        consumedBefore: {$ref: '#/components/schemas/Money'}
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SampleClaimLine'
    SampleClaimList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SampleClaim'
    TestRuleSetRequest:
      type: object
      required: [sampleClaimIds]
      properties:
        sampleClaimIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    SampleLineResult:
      type: object
      required: [result, coveredAmount, ruleCode]
      properties:
        result: {$ref: '#/components/schemas/LineResult'}
        coveredAmount: {$ref: '#/components/schemas/Money'}
        ruleCode: {type: string}
    SampleOutcome:
      type: object
      required: [eligibleTotal, afterRateAmount, remainingLimit, payableAmount]
      properties:
        eligibleTotal: {$ref: '#/components/schemas/Money'}
        afterRateAmount: {$ref: '#/components/schemas/Money'}
        remainingLimit: {type: integer, format: int64}
        payableAmount: {$ref: '#/components/schemas/Money'}
    TestRunSample:
      type: object
      required: [sampleClaimId, code, name, draft, current, lines, differs]
      properties:
        sampleClaimId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        draft: {$ref: '#/components/schemas/SampleOutcome'}
        current:
          description: Null when the plan has no published version yet.
          oneOf:
            - $ref: '#/components/schemas/SampleOutcome'
            - type: 'null'
        lines:
          type: array
          items:
            type: object
            required: [lineNo, description, categoryCode, claimedAmount, draft, current, differs]
            properties:
              lineNo: {type: integer, minimum: 1}
              description: {type: string}
              categoryCode: {type: string}
              claimedAmount: {$ref: '#/components/schemas/Money'}
              draft: {$ref: '#/components/schemas/SampleLineResult'}
              current:
                oneOf:
                  - $ref: '#/components/schemas/SampleLineResult'
                  - type: 'null'
              differs: {type: boolean}
        differs: {type: boolean}
    TestRunResult:
      type: object
      required: [draftVersionNo, currentVersionNo, samples]
      properties:
        draftVersionNo: {type: integer, minimum: 1}
        currentVersionNo: {type: [integer, 'null']}
        samples:
          type: array
          items:
            $ref: '#/components/schemas/TestRunSample'
    # ---- AI quality ----
    Kpi:
      type: object
      required: [value, previousValue, change]
      properties:
        value: {type: number, description: A count for fieldsExtracted; a rate from 0 to 1 for the others.}
        previousValue: {type: [number, 'null'], description: Same measure in the previous period of the same length.}
        change: {type: [number, 'null']}
    NullableKpi:
      oneOf:
        - $ref: '#/components/schemas/Kpi'
        - type: 'null'
    BreakdownRow:
      type: object
      required: [key, rate, count]
      properties:
        key: {type: string, description: 'A document type, field key, benefit category or flag type.'}
        rate: {type: number, minimum: 0, maximum: 1}
        count: {type: integer, minimum: 0}
    AiQualityMetrics:
      type: object
      required: [from, to, modelVersion, availableModelVersions, aiRunCount, kpis, breakdowns]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        modelVersion: {type: [string, 'null']}
        availableModelVersions:
          type: array
          description: Values for the model filter, newest first.
          items:
            type: string
        aiRunCount: {type: integer, minimum: 0}
        kpis:
          type: object
          required: [fieldsExtracted, lowConfidenceRate, correctionRate, mappingCorrectionRate, mappingAutoAcceptedRate, flagDismissalRate, clinicalFalsePositiveRate]
          properties:
            fieldsExtracted: {$ref: '#/components/schemas/Kpi'}
            lowConfidenceRate: {$ref: '#/components/schemas/Kpi'}
            correctionRate: {$ref: '#/components/schemas/Kpi'}
            mappingCorrectionRate: {$ref: '#/components/schemas/Kpi'}
            mappingAutoAcceptedRate: {$ref: '#/components/schemas/Kpi'}
            flagDismissalRate: {$ref: '#/components/schemas/Kpi'}
            clinicalFalsePositiveRate:
              description: Golden-set runs only; null when there are none.
              $ref: '#/components/schemas/NullableKpi'
        breakdowns:
          type: object
          required: [lowConfidenceByDocumentType, correctionsByField, mappingAutoAcceptedByCategory, flagDismissalByType]
          properties:
            lowConfidenceByDocumentType:
              type: array
              items:
                $ref: '#/components/schemas/BreakdownRow'
            correctionsByField:
              type: array
              items:
                $ref: '#/components/schemas/BreakdownRow'
            mappingAutoAcceptedByCategory:
              type: array
              items:
                $ref: '#/components/schemas/BreakdownRow'
            flagDismissalByType:
              type: array
              items:
                $ref: '#/components/schemas/BreakdownRow'
