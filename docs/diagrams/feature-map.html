<!doctype html>
<!-- Feature map grouped by use case. Source of docs/images/feature-map.png; the same data also builds 02_Feature_Map.xmind. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClaimLens feature map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1c1c1c; --muted: #6b6965; --ai: #6d28d9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; font-family: Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #map { position: relative; }
  svg { position: absolute; inset: 0; overflow: visible; }
  .n { position: absolute; }
  .root {
    width: 300px; padding: 22px 20px; border-radius: 10px; border: 2px solid #1c1c1c;
    background: #3949ab; color: #fff; text-align: center; font-weight: 700; font-size: 25px; line-height: 1.2;
  }
  .root small { display: block; font-size: 13px; font-weight: 500; opacity: .85; margin-top: 8px; }
  .group { width: 210px; padding: 12px 14px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 17px; }
  .group small { display: block; font-weight: 500; font-size: 12px; opacity: .9; margin-top: 3px; }
  .uc { width: 252px; padding: 9px 12px; border-radius: 7px; background: #fff; border: 2px solid; font-weight: 600; font-size: 14px; line-height: 1.3; }
  .uc small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .leaf { max-width: 330px; font-size: 13px; line-height: 1.35; padding: 0 2px 3px; border-bottom: 1.5px solid; white-space: nowrap; }
  .leaf .ai {
    display: inline-block; margin-left: 6px; font-size: 9.5px; font-weight: 700; color: var(--ai);
    border: 1px solid var(--ai); border-radius: 3px; padding: 0 3px; vertical-align: 1px;
  }
  .legend { position: absolute; left: 40px; top: 28px; font-size: 13px; color: var(--muted); }
  .legend b { color: var(--ink); font-size: 18px; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="map"><svg id="wires"></svg></div>

<script type="application/json" id="data">
{
  "root": "ClaimLens",
  "subtitle": "AI-assisted outpatient claims adjudication · 14 use cases · 25 user stories",
  "groups": [
    { "name": "Intake", "roles": "Intake Officer", "color": "#E78733", "side": "right", "ucs": [
      { "id": "UC01", "name": "Sign in to role workspace", "meta": "All roles · US01", "items": [
        ["Sign in with email and password"], ["Land on the role home"], ["403 for pages outside the role"]]},
      { "id": "UC02", "name": "Register claim", "meta": "US03", "items": [
        ["Search member by name, ID or policy no."], ["See policy status, coverage and balance"],
        ["Enter service date, provider, total, channel"], ["Warn when outside coverage"]]},
      { "id": "UC03", "name": "Upload claim documents", "meta": "US04 · US05 · US06 · US19", "items": [
        ["Upload PDF / JPG / PNG and submit"], ["Page check: type and readability", "AI"],
        ["Extract fields with source region", "AI"], ["Add supplementary documents"]]}
    ]},
    { "name": "Assessment", "roles": "Claims Reviewer", "color": "#2A9C6C", "side": "right", "ucs": [
      { "id": "UC04", "name": "Verify extracted evidence", "meta": "US07 · US25", "items": [
        ["Pick up a claim from the review queue"], ["Verify fields, lowest confidence first"],
        ["Click a field to see its source region"], ["Reclassify a page and re-read it", "AI"]]},
      { "id": "UC05", "name": "Resolve validation alerts", "meta": "US08 · US09 · US10", "items": [
        ["Completeness and consistency checks"], ["Duplicate invoice and claim detection"],
        ["Clinical inconsistency signals", "AI"], ["Fix data or dismiss with reason"]]},
      { "id": "UC06", "name": "Review benefit adjudication", "meta": "US11 · US12 · US13 · US14", "items": [
        ["Map expense lines to benefits", "AI"], ["Rules by the service-date rule set"],
        ["Payable formula and remaining balance"], ["Re-run with numbered revisions"]]},
      { "id": "UC07", "name": "Review risk flags", "meta": "Reviewer · Approver · US15", "items": [
        ["Flags with evidence: signal, not a finding", "AI"], ["Dismiss or keep for approver with reason"],
        ["Add a manual flag"], ["Escalate for investigation (approver)"]]}
    ]},
    { "name": "Decision", "roles": "Claims Reviewer · Senior Approver", "color": "#C34D83", "side": "left", "ucs": [
      { "id": "UC08", "name": "Submit recommendation", "meta": "Reviewer · US16 · US17 · US18", "items": [
        ["Override a line with reason code"], ["Draft summary with citations", "AI"],
        ["Attest auto-accepted AI values"], ["Submit to the approval queue"]]},
      { "id": "UC09", "name": "Request additional information", "meta": "Reviewer · US19", "items": [
        ["Checklist pre-filled from alerts"], ["Set and extend the deadline"],
        ["Template letter as PDF; closes after deadline"]]},
      { "id": "UC10", "name": "Approve, reject or return claim", "meta": "Senior Approver · US20", "items": [
        ["Approval queue by priority"], ["Approve, partially approve or reject"],
        ["Return to reviewer with comment"], ["Maker–checker and balance re-check"]]}
    ]},
    { "name": "Governance", "roles": "Administrator · Senior Approver", "color": "#177FAB", "side": "left", "ucs": [
      { "id": "UC11", "name": "Publish benefit rule-set version", "meta": "Administrator · US21 · US22", "items": [
        ["Categories, exclusions, waiting periods"], ["Reimbursement rate and limits"],
        ["Test the draft on synthetic claims"], ["Publish with effective-from date"]]},
      { "id": "UC12", "name": "Monitor operations & AI quality", "meta": "Senior Approver · US23", "items": [
        ["Backlog, handling time, outcomes, workload"], ["Low confidence, corrections, dismissals", "AI"],
        ["Drill down and export XLSX"]]},
      { "id": "UC13", "name": "Trace claim decision history", "meta": "Approver · Reviewer (own) · US24", "items": [
        ["Claim timeline with actor and time"], ["AI runs, corrections, revisions, overrides"],
        ["Audit log of claim events"]]},
      { "id": "UC14", "name": "Manage staff access", "meta": "Administrator · US02", "items": [
        ["Create, edit or disable accounts"], ["One role each; no self role change"], ["Access log"]]}
    ]}
  ]
}
</script>

<script>
const data = JSON.parse(document.getElementById("data").textContent);
const map = document.getElementById("map");
const svg = document.getElementById("wires");
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const el = (cls, html, style = {}) => {
  const d = document.createElement("div");
  d.className = "n " + cls; d.innerHTML = html; Object.assign(d.style, style); map.appendChild(d); return d;
};

document.fonts.ready.then(draw);
function draw() {
const G = { rootGap: 110, groupGap: 70, ucGap: 46, groupW: 210, ucW: 252, leafGapY: 9, ucGapY: 26, groupGapY: 56, margin: 60, top: 110 };

const root = el("root", `${esc(data.root)}<small>${esc(data.subtitle)}</small>`);
const legend = el("legend", `<b>Feature map by use case</b>Sidebar group → use case (stories) → main functions · <span style="color:#6d28d9;font-weight:600">AI</span> = AI-assisted, a person always confirms`);
legend.style.position = "absolute";

// build nodes and measure
for (const g of data.groups) {
  g.el = el("group", `${esc(g.name)}<small>${esc(g.roles)}</small>`, { background: g.color });
  for (const u of g.ucs) {
    u.el = el("uc", `${u.id} ${esc(u.name)}<small>${esc(u.meta)}</small>`, { borderColor: g.color, color: g.color });
    u.leaves = u.items.map(([t, ai]) => el("leaf", esc(t) + (ai ? '<span class="ai">AI</span>' : ""), { borderColor: g.color }));
  }
}
const h = e => e.offsetHeight, w = e => e.offsetWidth;

// vertical sizes
function sizeSide(groups) {
  let total = 0;
  for (const g of groups) {
    g.blockH = 0;
    for (const u of g.ucs) {
      u.leavesH = u.leaves.reduce((s, l) => s + h(l), 0) + G.leafGapY * (u.leaves.length - 1);
      u.blockH = Math.max(h(u.el), u.leavesH);
      g.blockH += u.blockH;
    }
    g.blockH += G.ucGapY * (g.ucs.length - 1);
    g.blockH = Math.max(g.blockH, h(g.el));
    total += g.blockH;
  }
  return total + G.groupGapY * (groups.length - 1);
}
// left side runs bottom-up so the map reads clockwise in workflow order
const sides = { right: data.groups.filter(g => g.side === "right"), left: data.groups.filter(g => g.side === "left").reverse() };
const sideH = { right: sizeSide(sides.right), left: sizeSide(sides.left) };
const H = Math.max(sideH.right, sideH.left, h(root));
const maxLeaf = side => Math.max(...sides[side].flatMap(g => g.ucs.flatMap(u => u.leaves.map(w))));
const leftSpan = G.groupW + G.groupGap + G.ucW + G.ucGap + maxLeaf("left");
const rootX = G.margin + leftSpan + G.rootGap;
const rootY = G.top + (H - h(root)) / 2;
const place = (e, x, y) => { e.style.left = x + "px"; e.style.top = y + "px"; e._x = x; e._y = y; };
place(root, rootX, rootY);
place(legend, G.margin, 28);

const paths = [];
const curve = (x1, y1, x2, y2, color, width) => {
  const mx = (x1 + x2) / 2;
  paths.push(`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`);
};

for (const side of ["right", "left"]) {
  const dir = side === "right" ? 1 : -1;
  const rootEdge = side === "right" ? rootX + w(root) : rootX;
  const groupX = side === "right" ? rootEdge + G.rootGap : rootEdge - G.rootGap - G.groupW;
  const ucX = side === "right" ? groupX + G.groupW + G.groupGap : groupX - G.groupGap - G.ucW;
  const leafEdge = side === "right" ? ucX + G.ucW + G.ucGap : ucX - G.ucGap;
  let y = G.top + (H - sideH[side]) / 2;
  for (const g of sides[side]) {
    const gy = y + (g.blockH - h(g.el)) / 2;
    place(g.el, groupX, gy);
    const gMid = gy + h(g.el) / 2;
    curve(rootEdge, rootY + h(root) / 2, side === "right" ? groupX : groupX + G.groupW, gMid, g.color, 4);
    let uy = y + (g.blockH - (g.ucs.reduce((s, u) => s + u.blockH, 0) + G.ucGapY * (g.ucs.length - 1))) / 2;
    for (const u of g.ucs) {
      const ucy = uy + (u.blockH - h(u.el)) / 2;
      place(u.el, ucX, ucy);
      const uMid = ucy + h(u.el) / 2;
      curve(side === "right" ? groupX + G.groupW : groupX, gMid, side === "right" ? ucX : ucX + G.ucW, uMid, g.color, 2.5);
      let ly = uy + (u.blockH - u.leavesH) / 2;
      for (const l of u.leaves) {
        const lx = side === "right" ? leafEdge : leafEdge - w(l);
        place(l, lx, ly);
        const base = ly + h(l) - 0.75;
        curve(side === "right" ? ucX + G.ucW : ucX, uMid, leafEdge, base, g.color, 1.5);
        ly += h(l) + G.leafGapY;
      }
      uy += u.blockH + G.ucGapY;
    }
    y += g.blockH + G.groupGapY;
  }
}

const rightSpan = G.groupW + G.groupGap + G.ucW + G.ucGap + maxLeaf("right");
const W = rootX + w(root) + G.rootGap + rightSpan + G.margin;
map.style.width = W + "px";
map.style.height = G.top + H + G.margin + "px";
svg.setAttribute("width", W); svg.setAttribute("height", G.top + H + G.margin);
svg.innerHTML = paths.join("");
}
</script>
</body>
</html>
